<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2418"/>
      <stop offset="100%" stop-color="#121014"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e8c4a8"/>
      <stop offset="100%" stop-color="#c99572"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3428"/>
      <stop offset="100%" stop-color="#2a1c16"/>
    </linearGradient>
    <linearGradient id="blouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ebe0"/>
      <stop offset="100%" stop-color="#d9cfc0"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <!-- shoulders / blouse -->
  <path d="M28 200c12-38 36-58 72-58s60 20 72 58" fill="url(#blouse)"/>
  <!-- neck -->
  <rect x="86" y="118" width="28" height="28" rx="10" fill="url(#skin)"/>
  <!-- hair back -->
  <ellipse cx="100" cy="78" rx="54" ry="58" fill="url(#hair)"/>
  <!-- face -->
  <ellipse cx="100" cy="88" rx="36" ry="42" fill="url(#skin)"/>
  <!-- hair front -->
  <path d="M64 78c4-28 22-46 36-48 8 14 18 18 28 16 10 2 18-2 24-12 12 8 24 28 22 52-18-10-36-8-52-2-14 5-30 4-58-6z" fill="url(#hair)"/>
  <!-- eyes -->
  <ellipse cx="86" cy="88" rx="3.2" ry="3.6" fill="#2b211c"/>
  <ellipse cx="114" cy="88" rx="3.2" ry="3.6" fill="#2b211c"/>
  <!-- brows -->
  <path d="M78 80c5-3 12-3 17 0" stroke="#3a2a22" stroke-width="2" stroke-linecap="round"/>
  <path d="M105 80c5-3 12-3 17 0" stroke="#3a2a22" stroke-width="2" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M90 104c4 6 16 6 20 0" stroke="#a56b52" stroke-width="2.2" stroke-linecap="round"/>
  <!-- gold earring hint -->
  <circle cx="64" cy="100" r="2.5" fill="#c5a059"/>
  <circle cx="136" cy="100" r="2.5" fill="#c5a059"/>
</svg>
